<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dopamine live1 · PAPER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080c;
      --panel: #0d1017;
      --ink: #e8edf7;
      --muted: #7d8699;
      --line: #1c2230;
      --up: #3dff9a;
      --down: #ff5d73;
      --paper: #ffb020;
      --pulse: #3dff9a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.01em;
    }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 10px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--pulse);
      box-shadow: 0 0 0 0 rgba(61, 255, 154, 0.7);
      animation: pulse 1.6s infinite;
    }
    .pulse.stale { background: var(--down); box-shadow: none; animation: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(61, 255, 154, 0.55); }
      70% { box-shadow: 0 0 0 12px rgba(61, 255, 154, 0); }
      100% { box-shadow: 0 0 0 0 rgba(61, 255, 154, 0); }
    }
    h1 { margin: 0; font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; }
    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--paper);
      color: var(--paper);
      padding: 4px 8px;
      border-radius: 999px;
    }
    .meta { color: var(--muted); font-size: 12px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 16px 22px 8px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .label { color: var(--muted); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
    .value { margin-top: 8px; font-size: 22px; font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 12px;
      padding: 8px 22px 18px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 0; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .feed { max-height: 420px; overflow: auto; }
    .event { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .event time { color: var(--muted); }
    .tape {
      margin: 0 22px 24px;
      overflow: hidden;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .empty { color: var(--muted); padding: 18px 0; }
    @media (max-width: 820px) {
      .metrics, .grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div id="pulse" class="pulse" aria-hidden="true"></div>
      <div>
        <h1>dopamine · live1</h1>
        <div id="status" class="meta mono">waiting for paper snapshot</div>
      </div>
    </div>
    <div class="tag">PAPER ONLY</div>
  </header>

  <section class="metrics">
    <article class="card">
      <div class="label">Equity</div>
      <div id="equity" class="value mono">--</div>
    </article>
    <article class="card">
      <div class="label">Cash</div>
      <div id="cash" class="value mono">--</div>
    </article>
    <article class="card">
      <div class="label">P&L</div>
      <div id="pnl" class="value mono">--</div>
    </article>
    <article class="card">
      <div class="label">Positions</div>
      <div id="posCount" class="value mono">--</div>
    </article>
  </section>

  <section class="grid">
    <article class="card">
      <div class="label">Book</div>
      <div id="book"><div class="empty">No open paper positions.</div></div>
    </article>
    <article class="card">
      <div class="label">Feed</div>
      <div id="feed" class="feed"><div class="empty">Pulse idle. Run python3 run_session.py then python3 sync_dashboard.py.</div></div>
    </article>
  </section>

  <div id="tape" class="tape mono"></div>
  <script src="dash.js?v=live1"></script>
</body>
</html>
